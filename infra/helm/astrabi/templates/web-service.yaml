apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-web" (include "astrabi.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app: {{ printf "%s-web" (include "astrabi.name" . | trunc 58 | trimSuffix "-") }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app: {{ printf "%s-web" (include "astrabi.name" . | trunc 58 | trimSuffix "-") }}
