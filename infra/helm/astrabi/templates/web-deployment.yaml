apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-web" (include "astrabi.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app: {{ printf "%s-web" (include "astrabi.name" . | trunc 58 | trimSuffix "-") }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: {{ printf "%s-web" (include "astrabi.name" . | trunc 58 | trimSuffix "-") }}
  template:
    metadata:
      labels:
        app: {{ printf "%s-web" (include "astrabi.name" . | trunc 58 | trimSuffix "-") }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: ASTRABI_API_URL
              value: {{ .Values.web.apiUrl | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
