replicaCount: 1

image:
  repository: astrabi-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

webOrigin: "http://localhost:3000"

web:
  replicaCount: 1
  image:
    repository: astrabi-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  apiUrl: "http://localhost:4000"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

secrets:
  name: astrabi-secrets
  databaseUrlKey: DATABASE_URL
  jwtSecretKey: JWT_SECRET
  dataEncryptionKey: ASTRABI_DATA_ENCRYPTION_KEY

postgresHostAllowlist: ""

podAnnotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
